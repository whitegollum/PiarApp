services:

  postgres:
    image: postgres:16-alpine
    container_name: piar_postgres
    restart: unless-stopped
    networks:
      - piar-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - piar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: piar_backend
    restart: unless-stopped
    networks:
      - piar-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SENDER=${SMTP_SENDER}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME}
      - SMTP_USE_TLS=${SMTP_USE_TLS}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - piar_data:/app/data
      - piar_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_APP_NAME: PiarAPP
        VITE_APP_VERSION: 0.1.0
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    container_name: piar_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - piar-network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.piarapp.rule=Host(`codeservergollumrun.duckdns.org`)"
      - "traefik.http.routers.piarapp.entrypoints=websecure"
      - "traefik.http.routers.piarapp.tls=true"
      - "traefik.http.routers.piarapp.tls.certresolver=letsencrypt"

      - "traefik.http.services.piarapp.loadbalancer.server.port=80"

networks:
  piar-network:
    driver: bridge
  proxy:
    external: true

volumes:
  piar_data:
  piar_uploads:
  piar_pgdata:
